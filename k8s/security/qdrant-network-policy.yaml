apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: qdrant-ingress-only-api-go
  namespace: ai-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: qdrant
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-go
      ports:
        - protocol: TCP
          port: 6333
        - protocol: TCP
          port: 6334        
        - protocol: TCP
          port: 6335