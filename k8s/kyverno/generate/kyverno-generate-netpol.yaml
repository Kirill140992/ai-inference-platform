apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: add-default-deny-netpol
spec:
  rules:
  - name: default-deny-ingress
    match:
      any:
      - resources:
          kinds:
          - Namespace
    exclude:
      resources:
        namespaces:
        - kube-system
        - kyverno
        - monitoring
    generate:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      name: default-deny-all
      namespace: "{{request.object.metadata.name}}"
      data:
        spec:
          podSelector: {}
          policyTypes:
          - Ingress
          - Egress
          egress:
          - ports:
            - protocol: UDP
              port: 53
            - protocol: TCP
              port: 53