apiVersion: apps/v1
kind: Deployment
metadata:
  name: evm-node
  namespace: ai-platform
  labels:
    app: evm-node
  annotations:
    checkov.io/skip1: "CKV2_K8S_6=NetworkPolicy is handled globally by Kyverno"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: evm-node
  template:
    metadata:
      labels:
        app: evm-node
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: anvil
          # checkov:skip=CKV_K8S_43: Using versioned tag to avoid digest resolution issues in this environment
          image: ghcr.io/foundry-rs/foundry:nightly
          imagePullPolicy: IfNotPresent
          command: ["anvil", "--host", "0.0.0.0", "--block-time", "2"]
          ports:
            - containerPort: 8545
              name: rpc
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: evm-node
  namespace: ai-platform
  labels:
    app: evm-node
spec:
  selector:
    app: evm-node
  ports:
    - name: rpc
      port: 8545
      targetPort: 8545
  type: ClusterIP