apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: api-go
  namespace: ai-platform
  labels:
    app: api-go
  annotations:
    checkov.io/skip1: "CKV_K8S_43=Using image tags for dev environment"
    checkov.io/skip2: "CKV2_K8S_6=NetworkPolicy is handled globally by Kyverno"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-go
  strategy:
    canary:
      steps:
        - setWeight: 20
        - pause: {duration: 30s}
        - setWeight: 50
        - pause: {}
  template:
    metadata:
      labels:
        app: api-go
      annotations:
        checkov.io/skip1: "CKV_K8S_43=Using image tags for dev environment"
        checkov.io/skip2: "CKV2_K8S_6=NetworkPolicy is handled globally by Kyverno/Cilium"
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api-go
          image: ghcr.io/kirill140992/ai-inference-platform-api-go:v0.6.1
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: PORT
              value: "8000"
            - name: QDRANT_URL
              value: "http://qdrant:6333"
            - name: QDRANT_COLLECTION
              value: "knowledge"
            # Readiness stays Qdrant-only until a real vLLM endpoint exists;
            # flip to "true" during #0 Checkpoint 1 so /ready also gates on
            # the embeddings backend.
            - name: VLLM_READY_REQUIRED
              value: "false"
            # Pin these during #0 Checkpoint 1: VLLM_URL is the Tailscale
            # address of the Vast.ai host; EMBEDDING_MODEL/EMBEDDING_DIM must
            # match the model vLLM serves AND the Qdrant collection's size.
            - name: VLLM_URL
              value: "http://vast-gpu:8000/v1"
            - name: EMBEDDING_MODEL
              value: "mock-embedding-model"
            - name: EMBEDDING_DIM
              value: "384"
            - name: EVM_RPC_URL
              value: "http://evm-node.ai-platform.svc.cluster.local:8545"

          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"