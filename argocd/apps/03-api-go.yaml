apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api-go-backend
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: 'https://github.com/Kirill140992/ai-inference-platform.git'
    targetRevision: HEAD
    path: k8s/api
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: ai-platform