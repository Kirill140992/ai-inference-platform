name: Enterprise DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  # 1. SECRET SCANNING
  secret-scanning:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # UNIT TESTS: Go (build / vet / fmt / test) — the app/api-go Definition of
  # Done requires "go test ./... passes"; this makes that a real CI gate
  # instead of an unverified claim per commit.
  unit-tests:
    name: Unit Tests (Go)
    runs-on: ubuntu-latest
    needs: secret-scanning
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: app/api-go/go.mod
      - name: go build
        working-directory: app/api-go
        run: go build ./...
      - name: go vet
        working-directory: app/api-go
        run: go vet ./...
      - name: gofmt check
        working-directory: app/api-go
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi
      - name: go test
        working-directory: app/api-go
        run: go test ./... -v

  # 2. SAST: SEMGREP
  sast-semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    needs: secret-scanning
    permissions:
      contents: read
      security-events: write
      actions: read
    container:
      image: returntocorp/semgrep:1.66.0
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: semgrep scan --config=p/default --sarif --output=semgrep.sarif
      - name: Upload SARIF to GitHub Security / DefectDojo
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif

  # 3. SAST & CODE QUALITY: SONARQUBE
  sast-sonarqube:
    name: SAST & Quality (SonarQube)
    runs-on: ubuntu-latest
    needs: secret-scanning
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # 4. SCA & IaC: TRIVY
  sca-iac-trivy:
    name: SCA & IaC (Trivy)
    runs-on: ubuntu-latest
    needs: secret-scanning
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # 5. IaC: Checkov
  iac-checkov:
    name: IaC Audit (Checkov)
    runs-on: ubuntu-latest
    needs: secret-scanning
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          output_format: cli, sarif
          output_file_path: console,checkov-results.sarif
          soft_fail: false
      - name: Upload Checkov SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: checkov-results.sarif

  # 6. DAST: OWASP ZAP
  dast-zap:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: [sast-semgrep, sca-iac-trivy, unit-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Build and Run API Container
        run: |
          docker build -t api-go-staging ./app/api-go
          docker run -d -p 8080:8000 --name staging-api api-go-staging
          sleep 5
          
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: 'http://localhost:8080'
          fail_action: false