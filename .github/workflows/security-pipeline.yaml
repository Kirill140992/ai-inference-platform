name: Enterprise DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # 1. SECRET SCANNING
  secret-scanning:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. SAST: SEMGREP
  sast-semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    needs: secret-scanning
    permissions:
      contents: read
      security-events: write
      actions: read
    container:
      image: returntocorp/semgrepreturntocorp/semgrep:1.66.0
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: semgrep scan --config=p/default --sarif --output=semgrep.sarif
      - name: Upload SARIF to GitHub Security / DefectDojo
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif

  # 3. SAST & CODE QUALITY: SONARQUBE
  sast-sonarqube:
    name: SAST & Quality (SonarQube)
    runs-on: ubuntu-latest
    needs: secret-scanning
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # 4. SCA & IaC: TRIVY
  sca-iac-trivy:
    name: SCA & IaC (Trivy)
    runs-on: ubuntu-latest
    needs: secret-scanning
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # 5. DAST: OWASP ZAP
  dast-zap:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: [sast-semgrep, sca-iac-trivy]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Build and Run API Container
        run: |
          docker build -t api-go-staging ./app/api-go
          docker run -d -p 8080:8080 --name staging-api api-go-staging
          sleep 5 # Ждем, пока API поднимется
          
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: 'http://localhost:8080'
          fail_action: false